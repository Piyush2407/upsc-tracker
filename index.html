<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPSC Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2EF; --panel:#FFFFFF; --panel-2:#F7F8F5; --line:#DEDFDA;
  --ink:#171A1F; --muted:#666E7A;
  --brass:#8F6210; --brass-soft:#F6E8C8; --on-brass:#FFFFFF;
  --late:#A33A25; --late-soft:#F8DED8;
  --ok:#3D6A3B; --ok-soft:#DEEADC;
  --cool:#2E5A78; --cool-soft:#DCE8F0;
  --r:10px; --font:'Archivo','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151B; --panel:#1A1E26; --panel-2:#1F242D; --line:#2B313B;
  --ink:#E7E8E4; --muted:#929AA7;
  --brass:#E3B15C; --brass-soft:#3B3018; --on-brass:#171A1F;
  --late:#E58268; --late-soft:#3E241C;
  --ok:#86B582; --ok-soft:#1F2E1E;
  --cool:#78AECF; --cool-soft:#1B2A35;
}}
:root[data-theme="dark"]{
  --bg:#12151B; --panel:#1A1E26; --panel-2:#1F242D; --line:#2B313B;
  --ink:#E7E8E4; --muted:#929AA7;
  --brass:#E3B15C; --brass-soft:#3B3018; --on-brass:#171A1F;
  --late:#E58268; --late-soft:#3E241C;
  --ok:#86B582; --ok-soft:#1F2E1E;
  --cool:#78AECF; --cool-soft:#1B2A35;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 90px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.top h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.top .spacer{flex:1}
.count{display:flex;align-items:baseline;gap:7px}
.count .n{font-size:26px;font-weight:700;color:var(--brass);letter-spacing:-.02em}
.count .l{font-size:12px;color:var(--muted)}
.phase{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--cool-soft);color:var(--cool)}
.who{font-size:12px;color:var(--muted);margin:0 0 14px}
.who button{background:none;border:none;color:var(--brass);cursor:pointer;padding:0;text-decoration:underline}

/* nav */
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 12px;
  cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass);font-weight:600}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;
  background:var(--late-soft);color:var(--late);font-size:11px;font-weight:700;line-height:17px;text-align:center}

/* blocks */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.stat .n{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted);margin-top:1px}
.stat.alert .n{color:var(--late)}
.stat.good .n{color:var(--ok)}
section{margin-bottom:26px}
h2{font-size:15px;font-weight:600;margin:0 0 3px}
.hint{font-size:13px;color:var(--muted);margin:0 0 11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.queue{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:10px 13px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--muted);margin-top:1px}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.late{background:var(--late-soft);color:var(--late)}
.tag.due{background:var(--brass-soft);color:var(--brass)}
.tag.soon{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.cool{background:var(--cool-soft);color:var(--cool)}

.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:6px 12px;
  border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--on-brass);font-weight:600}
.btn.small{padding:4px 9px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger:hover{color:var(--late)}
.btn[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass);color:var(--brass);font-weight:600}

form.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
.f textarea{resize:vertical;min-height:38px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:600px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{text-align:right;white-space:nowrap}
tr.hidden-row td{opacity:.45}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.filters input{flex:1;min-width:140px}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:3px}

.chips{display:flex;gap:4px}
.chip{width:30px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
.chip.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.due{background:var(--brass-soft);border-color:var(--brass);color:var(--brass)}
.chip.late{background:var(--late-soft);border-color:var(--late);color:var(--late)}

/* syllabus heatmap */
.heat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.heat h3{font-size:13px;margin:0 0 8px;font-weight:600}
.heatgroup{margin-bottom:13px}
.heatgroup .gl{font-size:12px;color:var(--muted);margin-bottom:5px}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.cell{width:16px;height:16px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line);
  cursor:pointer;padding:0}
.cell[data-s="reading"]{background:var(--brass-soft);border-color:var(--brass)}
.cell[data-s="notes"]{background:var(--cool-soft);border-color:var(--cool)}
.cell[data-s="revised"]{background:var(--ok);border-color:var(--ok)}
.cell[data-s="hidden"]{background:repeating-linear-gradient(45deg,var(--panel-2),var(--panel-2) 3px,var(--line) 3px,var(--line) 4px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;
  border:1px solid var(--line)}

/* question game */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:12px}
.qnum{font-size:12px;color:var(--muted);margin-bottom:8px}
.qtext{font-size:18px;font-weight:600;line-height:1.35;margin-bottom:16px}
.qans{background:var(--panel-2);border-left:3px solid var(--brass);padding:11px 13px;border-radius:0 7px 7px 0;
  margin-bottom:14px;white-space:pre-wrap}
.qprog{display:flex;gap:5px;margin-bottom:14px}
.qdot{width:100%;height:5px;border-radius:3px;background:var(--line)}
.qdot.ok{background:var(--ok)} .qdot.no{background:var(--late)} .qdot.now{background:var(--brass)}

svg.chart{display:block;width:100%;height:auto}
.two{display:grid;gap:12px}
@media(min-width:720px){
  .two{grid-template-columns:1fr 1fr}
  .grid.g2{grid-template-columns:repeat(2,1fr)}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  .span2{grid-column:span 2}
}
.hide{display:none!important}
.foot-note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:13px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>UPSC Command Center</h1>
    <span class="phase" id="phase"></span>
    <span class="spacer"></span>
    <div class="count"><span class="n" id="cdN">—</span><span class="l" id="cdL"></span></div>
  </header>
  <p class="who" id="who">Starting up…</p>

  <nav id="nav" role="tablist">
    <button role="tab" data-v="today" aria-selected="true">Today<span class="badge hide" id="bDue">0</span></button>
    <button role="tab" data-v="syllabus" aria-selected="false">Syllabus</button>
    <button role="tab" data-v="revision" aria-selected="false">Revision</button>
    <button role="tab" data-v="daily" aria-selected="false">Daily log</button>
    <button role="tab" data-v="answers" aria-selected="false">Answers</button>
    <button role="tab" data-v="ca" aria-selected="false">Current affairs</button>
    <button role="tab" data-v="quiz" aria-selected="false">Questions</button>
    <button role="tab" data-v="progress" aria-selected="false">Progress</button>
  </nav>

  <main id="main"></main>

  <p class="foot-note" id="footnote"></p>
</div>

{id:"p163",subject:"Polity",topic:"Judgments",q:"What did the First, Second and Third Judges Cases hold?",a:"First (1981): consultation with CJI does not mean concurrence; primacy to Executive. Second (1993): CJI's recommendation (based on collegium of senior judges) would have primacy. Third (1998): formally institutionalised collegium"},
{id:"p164",subject:"Polity",topic:"Judgments",q:"Collegium composition for SC and HC?",a:"SC: CJI + 4 senior-most judges of SC. HC: CJ(HC) + 2 senior-most judges of HC + inputs from SC collegium"},
{id:"p165",subject:"Polity",topic:"Judgments",q:"CIC v. Supreme Court of India (2010) held?",a:"CJI comes under RTI Act, requiring disclosure of judges' assets"},
{id:"p166",subject:"Polity",topic:"Judgments",q:"Vineet Narain Case (1997) held?",a:"Establishment of CBI's autonomy; judicial monitoring of corruption investigations"},
{id:"p167",subject:"Polity",topic:"Judgments",q:"L. Chandra Kumar v. UoI (1997) held?",a:"Tribunals are subject to judicial review"},
{id:"p168",subject:"Polity",topic:"Judgments",q:"Delhi Services Case (2023) held?",a:"Elected governments must control civil servants, limiting Centre's power under Art 239AA"},
{id:"p169",subject:"Polity",topic:"Judgments",q:"Centre v. Governor (Tamil Nadu, 2024) held?",a:"Governor cannot withhold bills indefinitely"},
{id:"p170",subject:"Polity",topic:"Judgments",q:"Ram Jawaya Kapur v. State of Punjab (1955) held?",a:"India does not follow a strict separation, but a functional separation"},
{id:"p171",subject:"Polity",topic:"Judgments",q:"Anoop Baranwal v. UoI (2023) held?",a:"Selection Committee of CEC & ECs — PM, LoP, CJI — until Parliament enacted a formal law"},
{id:"p172",subject:"Polity",topic:"Judgments",q:"Lily Thomas v. UoI (2013) held?",a:"MPs/MLAs disqualified immediately on conviction"},
{id:"p173",subject:"Polity",topic:"Judgments",q:"ADR Case (2002) held?",a:"Mandated declaration of criminal records, assets and education by candidates"},
{id:"p174",subject:"Polity",topic:"Judgments",q:"Hussainara Khatoon v. State of Bihar (1979) held?",a:"Right to speedy trial as part of Art 21"},
{id:"p175",subject:"Polity",topic:"Judgments",q:"Shayara Bano v. UoI (2017) held?",a:"Triple talaq — unconstitutional"},
{id:"p176",subject:"Polity",topic:"Judgments",q:"M. Nagraj (2006) laid down which conditions for reservations in promotions?",a:"Quantifiable data, backwardness, efficiency"},
{id:"p177",subject:"Polity",topic:"Judgments",q:"Jarnail Singh v. Lachhmi Narain Gupta (2018) changed what?",a:"Removed 'backwardness' from conditions for SC/ST promotions"},
{id:"p178",subject:"Polity",topic:"Judgments",q:"Janhit Abhiyan v. UoI (2022) held?",a:"Allowed breach of 50% reservation cap"},
{id:"p179",subject:"Polity",topic:"Judgments",q:"Aadhaar Verdict (2018) / Puttuswamy-II held?",a:"Upheld Aadhaar for welfare; need for proportional and minimal data use"},
{id:"p180",subject:"Polity",topic:"Judgments",q:"Prakash Singh Case (2006) dealt with?",a:"Orders on Police Reforms"},
{id:"p181",subject:"Polity",topic:"Judgments",q:"Subramanian Swamy v. UoI (2014) held?",a:"PIL not to become 'publicity interest litigations'"},

/* ============ POLITY — COMMITTEES & COMMISSIONS ============ */
{id:"p182",subject:"Polity",topic:"Committees",q:"Balwant Rai Mehta Committee (1957) recommended?",a:"Establish 3-tier Panchayati Raj — Gram Panchayat (Village), Panchayat Samiti (Block), Zila Parishad (District); direct elections and decentralised planning"},
{id:"p183",subject:"Polity",topic:"Committees",q:"L.M. Singhvi Committee (1986) recommended?",a:"Give constitutional status to PRIs; Gram Sabha as foundation of local democracy"},
{id:"p184",subject:"Polity",topic:"Committees",q:"G.V.K. Rao Committee (1985) recommended?",a:"District planning and implementation; strengthen Zila Parishads"},
{id:"p185",subject:"Polity",topic:"Committees",q:"Vohra Committee (1993) highlighted?",a:"Criminal-politician nexus; legal and administrative reforms"},
{id:"p186",subject:"Polity",topic:"Committees",q:"Swaran Singh Committee (1976) recommended?",a:"Fundamental Duties"},
{id:"p187",subject:"Polity",topic:"Committees",q:"Indrajit Gupta Committee (1998) recommended?",a:"State funding of elections in kind"},
{id:"p188",subject:"Polity",topic:"Committees",q:"Fazl Ali and JVP Committees dealt with?",a:"State Reorganisation"},
{id:"p189",subject:"Polity",topic:"Committees",q:"Xaxa Committee recommendations on PESA include?",a:"Protect Gram Sabha autonomy; recognise hamlet-level sabhas; integrate with other laws (FRA, MGNREGA); mining contracts to tribal cooperatives; raise awareness and build capacity; create monitoring mechanisms"},
{id:"p190",subject:"Polity",topic:"Committees",q:"Xaxa Committee (2014) on Tribal Welfare recommended?",a:"Recognize customary tribal laws; review land acquisition laws; strengthen Tribal Area Councils (TACs); prevent forced displacement"},
{id:"p191",subject:"Polity",topic:"Committees",q:"Dinesh Goswami Committee (1990) recommended on campaigns?",a:"Strict enforcement of Model Code of Conduct; curb on paid news; monitoring of hate speech & fake news"},
{id:"p192",subject:"Polity",topic:"Committees",q:"Sarkaria Commission (1988) key recommendations?",a:"Cooperative federalism; Inter-State Council with regular meetings and statutory backing; political neutrality of Governor; Governor appointee from outside the state and acceptable to CM; Governor must return bills within 4-6 weeks; greater state consultation in AIS appointments; Cabinet should meet regularly"},
{id:"p193",subject:"Polity",topic:"Committees",q:"Punchhi Commission key recommendations?",a:"Inter-State Council statutory backing; fixed tenure of Governor; post-retirement cooling off period for Governor; Inter-State Trade & Commerce Commission; better documentation of Cabinet decisions; functional expansion of V-P's role"},
{id:"p194",subject:"Polity",topic:"Committees",q:"Punchhi Commission's selection panel for Governor?",a:"PM, Home Minister, CM of state, Speaker"},
{id:"p195",subject:"Polity",topic:"Committees",q:"Rohini Commission — finding and recommendation?",a:"Finding: 97% of OBC benefits went to just 25% of OBC communities. Recommendation: Sub-categorization of OBCs"},
{id:"p196",subject:"Polity",topic:"Committees",q:"14th Finance Commission (2015-20) recommended what devolution?",a:"42% devolution of divisible taxes to states"},
{id:"p197",subject:"Polity",topic:"Committees",q:"15th Finance Commission recommended?",a:"41% devolution to states + 1% to J&K; performance-linked grants to ULBs; adopt clear activity mapping b/w state & municipal institutions to avoid overlapping"},
{id:"p198",subject:"Polity",topic:"Committees",q:"Bhuria Committee (1995) recommended?",a:"Extend PRI provisions to Scheduled Areas; decentralised decision-making"},
{id:"p199",subject:"Polity",topic:"Committees",q:"Dhebar Committee (1961) found?",a:"Development schemes failed due to lack of tribal participation"},
{id:"p200",subject:"Polity",topic:"Committees",q:"Justice Malimath and Justice Krishna Iyer Committees recommended?",a:"Malimath — Gram Nyayalayas; Krishna Iyer — Family Courts"},

/* ============ POLITY — NCRWC / LAW COMMISSION / 2nd ARC ============ */
{id:"p201",subject:"Polity",topic:"NCRWC",q:"NCRWC recommendation on Anti-Defection Law?",a:"Disqualification decision by an independent tribunal"},
{id:"p202",subject:"Polity",topic:"NCRWC",q:"NCRWC recommendations on Judicial Reforms?",a:"Establish National Judicial Commission to appoint judges; transparency in appointment of judges"},
{id:"p203",subject:"Polity",topic:"NCRWC",q:"NCRWC recommendations on Centre-State relations?",a:"Greater autonomy to states; reform Art 356 to prevent misuse; cooperative federalism; better fiscal devolution to states"},
{id:"p204",subject:"Polity",topic:"NCRWC",q:"NCRWC recommendations on Electoral Reforms?",a:"State funding of elections in kind; transparency in campaign finance; auditing of political parties"},
{id:"p205",subject:"Polity",topic:"NCRWC",q:"NCRWC recommendation on Preventive Detention?",a:"Capping at 6 months; advisory board of serving HC judges"},
{id:"p206",subject:"Polity",topic:"NCRWC",q:"NCRWC on how often Parliament should meet?",a:"At least 100 days per year"},
{id:"p207",subject:"Polity",topic:"Law Commission",q:"170th Report recommended?",a:"Transfer disqualification powers — Speaker to independent tribunal or ECI (ADR reforms)"},
{id:"p208",subject:"Polity",topic:"Law Commission",q:"214th Report recommended?",a:"Establish a permanent secretariat to manage logistics, maintain records and provide research inputs to the Collegium"},
{id:"p209",subject:"Polity",topic:"Law Commission",q:"Law Commission's recommended judge-to-population ratio?",a:"50 per million"},
{id:"p210",subject:"Polity",topic:"Law Commission",q:"272nd Report (2017) recommended?",a:"Uniformity in structure and tenure of members in Tribunals"},
{id:"p211",subject:"Polity",topic:"Law Commission",q:"255th Report recommended?",a:"Legal backing for de-registration of parties"},
{id:"p212",subject:"Polity",topic:"Law Commission",q:"Law Commission recommendation on candidates facing serious charges?",a:"Disqualification of candidates facing charges for serious offences, even before conviction, if framed by a court"},
{id:"p213",subject:"Polity",topic:"2nd ARC",q:"2nd ARC on the role of Governors?",a:"Governors to act as 'constitutional sentinels', not political actors"},
{id:"p214",subject:"Polity",topic:"2nd ARC",q:"2nd ARC on committee reports?",a:"Committee reports should be given more weight in law-making + Ministries must mandatorily respond within a fixed timeline"},
{id:"p215",subject:"Polity",topic:"2nd ARC",q:"2nd ARC on the 10th Schedule?",a:"Decisions under the 10th Schedule should be made by an external judicial body, not the Speaker"},
{id:"p216",subject:"Polity",topic:"2nd ARC",q:"2nd ARC recommendations on UPSC?",a:"Separate boards for technical & non-technical recruitment; overhaul of recruitment and training policies; reduction in political appointments"},
{id:"p217",subject:"Polity",topic:"2nd ARC",q:"2nd ARC on election funding?",a:"Create a National Election Fund → transparent & publicly disclosed donations; collegium-based appointments in Election Commission"},

/* ============ SOCIOLOGY — DISCIPLINE ============ */
{id:"s001",subject:"Sociology I",topic:"The Discipline",q:"What was the 'triple revolution' that sociology emerged in response to?",a:"French Revolution (political upheaval), Industrial Revolution (economic transformation), Enlightenment (intellectual rationalism)"},
{id:"s002",subject:"Sociology I",topic:"The Discipline",q:"Who coined 'sociology' and in what year, seeking what?",a:"Comte, 1838 — seeking a 'social physics' to restore post-revolutionary order"},
{id:"s003",subject:"Sociology I",topic:"The Discipline",q:"What was Europe's first sociology chair?",a:"Durkheim's appointment at Bordeaux (1895)"},
{id:"s004",subject:"Sociology I",topic:"The Discipline",q:"Which school gave sociology its American reformist orientation, and who were its key figures?",a:"Chicago School (1920s-40s) — Robert Park, Ernest Burgess (empirical, policy-oriented); Jane Addams, W.E.B. Du Bois (sociology as tool for social justice)"},
{id:"s005",subject:"Sociology I",topic:"The Discipline",q:"Which work is cited as pioneering empirical urban sociology with reformist intent?",a:"Du Bois's The Philadelphia Negro (1899)"},
{id:"s006",subject:"Sociology I",topic:"The Discipline",q:"Which non-Western work predates Comte and what is its key concept?",a:"Ibn Khaldun's Muqaddimah (14th c.) on social cohesion — asabiyyah"},
{id:"s007",subject:"Sociology I",topic:"The Discipline",q:"Which Ambedkar text is cited as a profoundly sociological work outside the Euro-American tradition?",a:"Annihilation of Caste (1936)"},
{id:"s008",subject:"Sociology I",topic:"The Discipline",q:"Who called sociology the 'self-consciousness of modernity'?",a:"Giddens"},
{id:"s009",subject:"Sociology I",topic:"The Discipline",q:"What did Durkheim's Rules of Sociological Method (1895) instruct?",a:"'Treat social facts as things' — study them with the same objectivity as natural phenomena"},
{id:"s010",subject:"Sociology I",topic:"The Discipline",q:"Which Durkheim work is the paradigmatic demonstration of scientific temper, and how?",a:"Suicide (1897) — used statistical data to reveal social (not individual) patterns"},
{id:"s011",subject:"Sociology I",topic:"The Discipline",q:"Whose falsifiability criterion refined the scientific-temper standard?",a:"Karl Popper"},
{id:"s012",subject:"Sociology I",topic:"The Discipline",q:"What is Weber's Verstehen and why does it qualify positivism?",a:"Interpretive understanding — showed sociology cannot simply replicate natural-science method; must account for subjective meaning"},
{id:"s013",subject:"Sociology I",topic:"The Discipline",q:"Who critiqued positivism from the Frankfurt School and phenomenology?",a:"Habermas (Frankfurt School) and Schutz (phenomenologists) — as inadequately capturing human agency"},
{id:"s014",subject:"Sociology I",topic:"The Discipline",q:"Kant's Enlightenment motto?",a:"'Dare to know' (Sapere Aude)"},
{id:"s015",subject:"Sociology I",topic:"The Discipline",q:"Who theorised society as a human construct via social contract?",a:"Hobbes, Locke, Rousseau"},
{id:"s016",subject:"Sociology I",topic:"The Discipline",q:"Which postcolonial work argues European categories are historically specific, not universal templates?",a:"Dipesh Chakrabarty's Provincializing Europe"},
{id:"s017",subject:"Sociology I",topic:"The Discipline",q:"Who applied statistics to human behaviour as 'social physics'?",a:"Quetelet"},
{id:"s018",subject:"Sociology I",topic:"The Discipline",q:"Which pre-sociological empirical account fed Marx's analysis?",a:"Engels's The Condition of the Working Class in England (1845)"},
{id:"s019",subject:"Sociology I",topic:"The Discipline",q:"What is Eisenstadt's thesis contesting Europe as the only site of modernity?",a:"Multiple modernities — modernity took diverse forms across civilisations, not a single European template replicated elsewhere"},
{id:"s020",subject:"Sociology I",topic:"The Discipline",q:"What is Giddens's double hermeneutic?",a:"Sociology interprets a world that is itself already interpreted by its inhabitants"},
{id:"s021",subject:"Sociology I",topic:"The Discipline",q:"Which Srinivas study is cited as paradigmatic sociology in a non-modern setting?",a:"Rampura village study (1952)"},
{id:"s022",subject:"Sociology I",topic:"The Discipline",q:"Peter Berger's 'first wisdom of sociology'?",a:"'Things are not what they seem' — sociology's function is to denaturalise taken-for-granted assumptions"},
{id:"s023",subject:"Sociology I",topic:"The Discipline",q:"Bauman on sociology and the familiar?",a:"Sociology 'defamiliarises the familiar'"},
{id:"s024",subject:"Sociology I",topic:"The Discipline",q:"Bourdieu's term for common sense shaped by power?",a:"Doxa"},
{id:"s025",subject:"Sociology I",topic:"The Discipline",q:"Whose phenomenological sociology treats the lifeworld as research's necessary starting point?",a:"Schutz"},
{id:"s026",subject:"Sociology I",topic:"The Discipline",q:"What is Durkheim's 'epistemological break'?",a:"Deliberately setting aside common-sense 'prenotions' before scientific analysis can begin"},
{id:"s027",subject:"Sociology I",topic:"The Discipline",q:"Who developed grounded theory?",a:"Glaser & Strauss"},
{id:"s028",subject:"Sociology I",topic:"The Discipline",q:"Which contradiction illustrates common sense's internal inconsistency?",a:"'Absence makes the heart grow fonder' AND 'out of sight, out of mind' held simultaneously without noticing the contradiction"},
{id:"s029",subject:"Sociology I",topic:"The Discipline",q:"C. Wright Mills's sociological imagination?",a:"Linking personal troubles to public issues; locating individual biography within historical structure"},
{id:"s030",subject:"Sociology I",topic:"The Discipline",q:"Which work demonstrates that class analysis requires deep historical grounding?",a:"Barrington Moore's Social Origins of Dictatorship and Democracy"},
{id:"s031",subject:"Sociology I",topic:"The Discipline",q:"Which school used sociological categories to transform historiography?",a:"Marc Bloch and the Annales School"},
{id:"s032",subject:"Sociology I",topic:"The Discipline",q:"Braudel's approach bridging temporal depth with structural analysis?",a:"Longue durée"},
{id:"s033",subject:"Sociology I",topic:"The Discipline",q:"Granovetter's concept bridging economics and sociology?",a:"'Embeddedness' — markets are socially embedded"},
{id:"s034",subject:"Sociology I",topic:"The Discipline",q:"How does sociology differ from political science on power?",a:"Political science focuses on the state and formal institutions; sociology studies power in all social institutions — family, religion, workplace, caste"},
{id:"s035",subject:"Sociology I",topic:"The Discipline",q:"Example distinguishing political scientist from sociologist on the 73rd Amendment?",a:"A political scientist studies its institutional design; a sociologist studies its social consequences (Sarpanch Pati, women's actual empowerment)"},
{id:"s036",subject:"Sociology I",topic:"The Discipline",q:"Classical sociology vs anthropology — object, method, scale?",a:"Object: sociology studied 'modern' industrial societies, anthropology 'pre-modern'/non-Western (now critiqued as a colonial distinction). Method: surveys/statistics vs ethnographic fieldwork. Scale: macro-institutional vs micro-community"},
{id:"s037",subject:"Sociology I",topic:"The Discipline",q:"Who brought social anthropological fieldwork into mainstream Indian sociology?",a:"M.N. Srinivas — Coorg study, Rampura village study"},
{id:"s038",subject:"Sociology I",topic:"The Discipline",q:"D.P. Mukerji's enduring insistence?",a:"Studying Indian society on its own terms, not through imported Western frameworks"},
{id:"s039",subject:"Sociology I",topic:"The Discipline",q:"Whose work exemplifies integrating global analytical tools with Indian social institutions?",a:"Surinder Jodhka's work on caste in contemporary business networks"},

/* ============ SOCIOLOGY II — PERSPECTIVES ============ */
{id:"s040",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"What are the primary sources of Ghurye's Indological method?",a:"Ancient Sanskrit texts — Vedas, Puranas, Dharmashastras, Manusmriti as primary sociological data"},
{id:"s041",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"Ghurye's Caste and Race in India (1932) argued what?",a:"Caste as a segmental division of society rooted in Brahminical ritual ordering — groundwork later built upon by Dumont's Homo Hierarchicus"},
{id:"s042",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"What did Ghurye's The Scheduled Tribes (1943) argue?",a:"Tribes were 'backward Hindus' rather than isolated primitives — controversial but agenda-setting for tribal-policy debate"},
{id:"s043",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"Name Ghurye's major works.",a:"Caste and Race in India; Family and Kinship in India; The Scheduled Tribes; Indian Sadhus; Cities and Civilization; Culture and Society in India"},
{id:"s044",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"What is the core critique of Ghurye's textual reliance?",a:"Over-reliance on Brahminical/Sanskritic texts privileges elite, upper-caste voice — excludes Dalit-Bahujan oral traditions; static reading treats textual prescription as social description"},
{id:"s045",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"Béteille's critique of Ghurye?",a:"Ghurye essentialised Hinduism as coextensive with 'Indian culture', marginalising Muslim, Christian and tribal India"},
{id:"s046",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"Yogendra Singh's critique of Ghurye?",a:"Overstates continuity, understates rupture and transformation under colonial capitalism and modernity"},
{id:"s047",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"Nicholas Dirks's critique of Ghurye's caste categories?",a:"They are partly colonial-census artefacts mistaken for timeless textual truths"},
{id:"s048",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"A.R. Desai's critique of Ghurye?",a:"Neglects material/economic exploitation embedded within caste, reading it as a purely cultural-religious institution"},
{id:"s049",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"Which contemporary movement is cited as reclaiming what Ghurye's tribes-as-backward-Hindus thesis erased?",a:"Jharkhand's Pathalgadi movement; demand for a separate Sarna religious code in the 2021 Census debate"},
{id:"s050",subject:"Sociology II",topic:"Perspectives — Ghurye",q:"Which scholar's work fills the gap Ghurye's Hindu-centric lens left open?",a:"Imtiaz Ahmad — contemporary scholarship on Muslim social structure"},
{id:"s051",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Srinivas's definition of Westernization?",a:"Changes introduced into Indian society and culture as a result of over a century of British rule — spanning technology, institutions, ideology and values"},
{id:"s052",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Three dimensions Westernization operates across?",a:"Technological (railways, printing press, modern administration); Institutional (legal system, bureaucracy, parliamentary democracy); Ideological (equality, liberty, humanitarianism)"},
{id:"s053",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Srinivas's two sub-types of Westernization?",a:"Primary Westernization (elite, English-educated) vs secondary Westernization (diffused, indirect)"},
{id:"s054",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Homi Bhabha's corrective to one-directional Westernization?",a:"Hybridity — cultures negotiate and hybridise influence, producing new forms rather than pure imitation"},
{id:"s055",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Six features of Srinivas's dominant caste?",a:"Numerical strength; economic power (control over arable land); political influence; educational advancement; ritual status; control over resources and labour (jajmani logic)"},
{id:"s056",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Examples of contemporary dominant castes?",a:"Jats in Haryana, Marathas in Maharashtra, Reddys/Kammas in Andhra Pradesh, Patels in Gujarat"},
{id:"s057",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Which agitations show numerically dominant but economically anxious castes seeking state recognition?",a:"Maratha and Patel reservation-quota agitations (2016-18)"},
{id:"s058",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"How has dominance shifted beyond land and ritual?",a:"Political mobilisation of numerically large but ritually low castes — rise of BSP under Kanshi Ram and Mayawati; OBC political ascendancy in the Mandal-era realignment"},
{id:"s059",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Srinivas's theoretical roots in structural functionalism?",a:"Durkheim's division of labour, Radcliffe-Brown's structural anthropology, Parsonian systems theory"},
{id:"s060",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"How is Sanskritization framed functionally?",a:"A functional safety-valve allowing status mobility without disrupting the overall caste structure"},
{id:"s061",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"How is the jajmani system read in structural-functional terms?",a:"A reciprocal, functionally integrated economic-social exchange between service and patron castes"},
{id:"s062",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Srinivas's methodological corrective to Ghurye?",a:"'Field-view vs book-view' distinction"},
{id:"s063",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Béteille's critique of structural-functionalism?",a:"Reduces individuals to structural 'cogs,' denying agency"},
{id:"s064",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"David Pocock's critique of functionalism?",a:"Urges critical examination of whose interests structural 'functions' actually serve, rather than assuming functions serve society as a whole"},
{id:"s065",subject:"Sociology II",topic:"Perspectives — Srinivas",q:"Feminist critique of Srinivas?",a:"Gender blindness — caste-kinship focus leaves gender as a structural axis largely unexamined; khap-style community policing of women's mobility exposes this"},
{id:"s066",subject:"Sociology II",topic:"Perspectives — Desai",q:"Desai's classic work?",a:"Social Background of Indian Nationalism"},
{id:"s067",subject:"Sociology II",topic:"Perspectives — Desai",q:"Central elements of Desai's Marxist sociology?",a:"Class analysis (economic base determines social structure); historical materialism; critique of colonialism as causing economic underdevelopment"},
{id:"s068",subject:"Sociology II",topic:"Perspectives — Desai",q:"How does Desai read Indian nationalism?",a:"As a non-homogenous movement fractured by conflicting class interests, not a unified anti-colonial front"},
{id:"s069",subject:"Sociology II",topic:"Perspectives — Desai",q:"Desai's theory of the state?",a:"State as an instrument of class domination, serving ruling-class interests both under colonial rule and after Independence"},
{id:"s070",subject:"Sociology II",topic:"Perspectives — Desai",q:"T.K. Oommen's critique of Desai?",a:"The Marxist framework gives insufficient weight to caste, community and ethnicity as independent axes"},
{id:"s071",subject:"Sociology II",topic:"Perspectives — Desai",q:"Rajendra Singh's critique of Desai?",a:"Insufficient direct engagement with agrarian relations despite their centrality to Indian class structure"},
{id:"s072",subject:"Sociology II",topic:"Perspectives — Desai",q:"Desai's dual reading of colonialism?",a:"Colonialism drained wealth and disrupted industry, yet paradoxically integrated India into the global capitalist economy — Ex: dismantling of Dacca muslin alongside railway construction"},
{id:"s073",subject:"Sociology II",topic:"Perspectives — Desai",q:"Desai's critique of the Nehruvian model?",a:"Prioritising industrialisation over agriculture, marginalising the rural population; land reforms poorly implemented and manipulated by ruling classes"},
{id:"s074",subject:"Sociology II",topic:"Perspectives — Desai",q:"Examples of agrarian class assertion vindicating Desai?",a:"Telangana peasant uprising (1946-51) and farmer protests against the 2020 farm laws"},
{id:"s075",subject:"Sociology II",topic:"Perspectives — Desai",q:"Partha Chatterjee's critique of Desai?",a:"His view of the state as simply a class instrument is too static, missing the state's more autonomous and contested character in practice"},
{id:"s076",subject:"Sociology II",topic:"Perspectives — Desai",q:"How does Desai read the Green Revolution dialectically?",a:"Aimed at food self-sufficiency but simultaneously deepened indebtedness among small farmers — Ex: Punjab's prosperity coexisting with its farm-debt and agrarian-distress crisis"},
{id:"s077",subject:"Sociology II",topic:"Perspectives — Desai",q:"Desai's dialectical reading of the Indian Railways?",a:"Brought modern infrastructure and mobility, yet simultaneously functioned as an extraction mechanism deepening class division"},
{id:"s078",subject:"Sociology II",topic:"Perspectives — Desai",q:"Class dialectic within the Civil Disobedience Movement?",a:"Drew together an urban bourgeoisie seeking business autonomy and a rural peasantry seeking land reform and tax relief — a shared anti-colonial front concealing divergent class ends"},

/* ============ SOCIOLOGY II — COLONIAL RULE ============ */
{id:"s079",subject:"Sociology II",topic:"Colonial Rule",q:"Benedict Anderson's two key concepts used for Indian nationalism?",a:"'Imagined community' thesis and print-capitalism — newspapers and periodicals manufactured a shared reading public transcending region"},
{id:"s080",subject:"Sociology II",topic:"Colonial Rule",q:"Sumit Sarkar on folk culture and nationalism?",a:"Folk culture (songs, street plays) as a vernacular vehicle carrying the nationalist message to non-literate masses"},
{id:"s081",subject:"Sociology II",topic:"Colonial Rule",q:"Which Tilak initiatives converted religious observance into public nationalist assembly?",a:"Ganeshotsav and Shivaji festivals"},
{id:"s082",subject:"Sociology II",topic:"Colonial Rule",q:"Weber's concept applied to Gandhi?",a:"Charismatic authority — transformed an elite movement into mass politics through Swaraj and non-violent civil disobedience"},
{id:"s083",subject:"Sociology II",topic:"Colonial Rule",q:"Ranajit Guha's subaltern studies argument?",a:"Marginalised groups (peasants, Dalits) generated their own autonomous nationalist consciousness, not simply following elite leadership"},
{id:"s084",subject:"Sociology II",topic:"Colonial Rule",q:"R.P. Dutt's work and argument?",a:"India Today — British colonialism introduced capitalist relations of production, restructuring India's economy for metropolitan extraction"},
{id:"s085",subject:"Sociology II",topic:"Colonial Rule",q:"E.M.S. Namboodiripad's argument on class consciousness?",a:"Colonial exploitation forged shared class consciousness across bourgeoisie, peasants and working class, each recognising a common structural oppressor"},
{id:"s086",subject:"Sociology II",topic:"Colonial Rule",q:"Marxist critiques of the nationalist movement itself?",a:"Bourgeois-leadership critique (Congress pursued its own class interest); ideological-constraint critique (left caste and class inequality unaddressed); land-reform critique (later manifesting in the Naxalite movement)"},
{id:"s087",subject:"Sociology II",topic:"Modernization",q:"Yogendra Singh's three traditional structures?",a:"Hierarchical (caste/stratification), sacred (religious-spiritual), regional (linguistic-cultural)"},
{id:"s088",subject:"Sociology II",topic:"Modernization",q:"Singh's original concepts contributed to modernization theory?",a:"Selective traditionality; distinguished westernization from modernization; rationalisation of tradition; indigenization of modernity"},
{id:"s089",subject:"Sociology II",topic:"Modernization",q:"What is 'selective traditionality'?",a:"Societies retain certain traditional elements while modifying or discarding others, rather than wholesale replacement"},
{id:"s090",subject:"Sociology II",topic:"Modernization",q:"What institutional example embodies indigenization for Singh?",a:"The Indian Constitution — blend of traditional consensus-building values with modern democratic principles"},
{id:"s091",subject:"Sociology II",topic:"Modernization",q:"Dipankar Gupta's critique of Singh?",a:"Singh's account tends toward an overly harmonious picture of integration, underplaying conflict"},
{id:"s092",subject:"Sociology II",topic:"Modernization",q:"Sudipta Kaviraj's critique of Singh?",a:"The integration of tradition and modernity is far more conflictual and uneven than Singh's account suggests"},
{id:"s093",subject:"Sociology II",topic:"Modernization",q:"Béteille's dialectical corrective to Singh?",a:"Tradition-modernity interaction is non-linear and more contested; traditional structures are more rigid than Singh assumes"},
{id:"s094",subject:"Sociology II",topic:"Modernization",q:"Which contemporary phenomena fall outside Singh's original schema?",a:"Digital economy and platform capitalism (UPI, gig work) — showing the thesis's temporal limits"},
{id:"s095",subject:"Sociology II",topic:"Modernization",q:"Arjun Appadurai's warning about globalisation?",a:"Homogenisation risk — globalisation flattening cultural diversity"},
{id:"s096",subject:"Sociology II",topic:"Modernization",q:"Ramachandra Guha's critique of modernization?",a:"Traditional sustainable practices are displaced by blind modernization, producing ecological damage"},
{id:"s097",subject:"Sociology II",topic:"Modernization",q:"Eisenstadt on tradition and modernity?",a:"Traditions are not static but continuously adapt; modernity itself takes distinct forms in different societies ('multiple modernities')"},
{id:"s098",subject:"Sociology II",topic:"Modernization",q:"Zygmunt Bauman on modernity's displacement?",a:"Modernity's displacement of traditional practice can produce marginalisation — Ex: traditional weavers displaced by machine-made fabric"},
{id:"s099",subject:"Sociology II",topic:"Modernization",q:"Roland Robertson's concept of glocalization, with example?",a:"Bollywood fuses global cinematic technique with deeply traditional narrative content"},
{id:"s100",subject:"Sociology II",topic:"Modernization",q:"Redfield's framework adapted to India by Srinivas?",a:"Little Tradition (local folk practice, rural in origin) and Great Tradition (classical, pan-Indian, wider civilizational reach)"},
{id:"s101",subject:"Sociology II",topic:"Modernization",q:"Examples of cultural revivalism in performing arts?",a:"Kathakali (Kerala Kalamandalam, UNESCO recognition); Dhrupad (Gundecha Brothers, Dagar family); Jatra (Bengal) and Tamasha (Maharashtra); Pandavani (Teejan Bai)"},
{id:"s102",subject:"Sociology II",topic:"Modernization",q:"Examples of revivalism in language dissemination?",a:"Samskrita Bharati (Sanskrit); Ganesh Devy's People's Linguistic Survey of India; Central Institute of Classical Tamil; Kodava community-level teaching"},
{id:"s103",subject:"Sociology II",topic:"Modernization",q:"Examples of revivalism in arts and crafts?",a:"Kalamkari; Khadi (Sabyasachi Mukherjee); Kumhar Sashaktikaran Yojana (pottery); Madhubani painting; Phulkari embroidery"},
{id:"s104",subject:"Sociology II",topic:"Reform Movements",q:"Satyashodhak Samaj — founder, year, aim?",a:"Jyotirao Phule, 1873 — asserted the right to interpret religious texts independently, sought to liberate lower castes from Brahmin ritual monopoly"},
{id:"s105",subject:"Sociology II",topic:"Reform Movements",q:"Brahmo Samaj — founder, year, key achievement?",a:"Raja Ram Mohan Roy, 1828 — 'Father of the Indian Renaissance'; activism against Sati culminated in Lord Bentinck's 1829 Regulation XVII"},
{id:"s106",subject:"Sociology II",topic:"Reform Movements",q:"Arya Samaj — founder, year, motto?",a:"Swami Dayananda Saraswati, 1875 — 'Back to the Vedas'; Shuddhi (reconversion) movement"},
{id:"s107",subject:"Sociology II",topic:"Reform Movements",q:"What was the Tinkathia system?",a:"Peasants coerced into cultivating indigo on three-twentieths of their landholding, leaving insufficient land for subsistence crops"},
{id:"s108",subject:"Sociology II",topic:"Reform Movements",q:"Champaran Satyagraha — year and significance?",a:"1917 — established Gandhi as a genuine mass leader and validated Satyagraha as an effective political method"},
{id:"s109",subject:"Sociology II",topic:"Reform Movements",q:"Tebhaga Movement — years, demand, leadership?",a:"1946-47; demand to shift crop-sharing from one-half to two-thirds in favour of the cultivating peasant; Kisan Sabha and CPI leadership. Ranajit Guha termed it a 'revolutionary peasant movement'"},
{id:"s110",subject:"Sociology II",topic:"Reform Movements",q:"Bengal's three-tiered agrarian system in Tebhaga?",a:"Zamindars, jotedars and bargadars (sharecroppers)"},
{id:"s111",subject:"Sociology II",topic:"Reform Movements",q:"Daniel Thorner on Tebhaga?",a:"The movement's echoes directly stimulated post-independence land-reform legislation"},
{id:"s112",subject:"Sociology II",topic:"Reform Movements",q:"Name the major pre-independence reform movements and founders.",a:"Brahmo Samaj (Roy, 1828); Arya Samaj (Dayanand, 1875); Prarthana Samaj (Maharashtra); Theosophical Society (Annie Besant); Ramakrishna Mission (Vivekananda); Aligarh Movement (Sir Syed Ahmed Khan); Self-Respect Movement (Periyar); Ahmadiyya Movement (Mirza Ghulam Ahmad)"},
{id:"s113",subject:"Sociology II",topic:"Untouchability",q:"Gandhi vs Ambedkar on untouchability?",a:"Gandhi's Harijan terminology and Harijan Sevak Sangh — later critiqued by Ambedkar for its paternalism. Ambedkar founded Scheduled Castes Federation and Independent Labour Party; led mass conversion to Buddhism"},
{id:"s114",subject:"Sociology II",topic:"Untouchability",q:"Legal architecture against untouchability?",a:"Article 17 abolishes untouchability; Protection of Civil Rights Act (1955); SC/ST (Prevention of Atrocities) Act (1989); reservation system"},
{id:"s115",subject:"Sociology II",topic:"Colonial Construction",q:"Edward Said's Orientalism applied to colonial India?",a:"Colonial administrators and intellectuals manufactured an image of the East as exotic, irrational and backward, justifying colonial rule as a civilising mission"},
{id:"s116",subject:"Sociology II",topic:"Colonial Construction",q:"How did legal codification reinforce traditionalism?",a:"Codification of Hindu personal law hardened caste boundaries rather than reflecting their historical flexibility; British patronage of landlords and priests strengthened regressive hierarchies"},
{id:"s117",subject:"Sociology II",topic:"Colonial Construction",q:"Macaulay's formulation on education?",a:"Producing a class 'Indian in blood and colour, but English in taste'"},

/* ============ SOCIOLOGY II — TRIBAL COMMUNITIES ============ */
{id:"s118",subject:"Sociology II",topic:"Tribal Communities",q:"Tribal share of India's population (Census 2011)?",a:"8.6%"},
{id:"s119",subject:"Sociology II",topic:"Tribal Communities",q:"Features distinguishing tribal communities?",a:"Geographical isolation (Elwin); distinct cultural practices (Geertz's 'local knowledge'); communal land ownership (Marx's primitive communism); kinship-based structure (N.K. Bose); animism/nature worship (Durkheim's totemism); self-sufficient economy; distinct political organisation"},
{id:"s120",subject:"Sociology II",topic:"Tribal Communities",q:"Examples of communal land ownership and tribal political organisation?",a:"Munda khuntkatti system in Jharkhand; Naga 'Khel' councils; Munda Parha system"},
{id:"s121",subject:"Sociology II",topic:"Tribal Communities",q:"F.G. Bailey's concept blurring tribe boundaries?",a:"Tribe-caste continuum — boundaries blurred in Odisha, Chhattisgarh"},
{id:"s122",subject:"Sociology II",topic:"Tribal Communities",q:"Appadurai's concept on fluid tribal identity?",a:"'Ethnoscapes' — tribal identities are fluid and actively reconstructed"},
{id:"s123",subject:"Sociology II",topic:"Tribal Communities",q:"Which Article defines STs, and on what basis?",a:"Article 366(25) — through political-administrative, not sociological, criteria"},
{id:"s124",subject:"Sociology II",topic:"Tribal Communities",q:"Colonial distortions of indigenous identity?",a:"Risley's racial classification and the Criminal Tribes Act (1871)"},
{id:"s125",subject:"Sociology II",topic:"Tribal Communities",q:"Walter Fernandes on displacement?",a:"~3 crore displaced in 50 years, 42% tribal"},
{id:"s126",subject:"Sociology II",topic:"Tribal Communities",q:"Bourdieu's concept applied to cultural erosion among tribes?",a:"'Symbolic violence' — Ex: Gondi language decline"},
{id:"s127",subject:"Sociology II",topic:"Tribal Communities",q:"Ghurye's three-fold classification of tribes?",a:"Hinduized, Partially Hinduized and Hill tribes"},
{id:"s128",subject:"Sociology II",topic:"Tribal Communities",q:"How did the GOI Act 1935 structure segregation?",a:"'Excluded Areas' (autonomous, minimal interference) and 'Partially Excluded Areas' (limited intervention); Governor's discretionary powers; indirect rule through hereditary chiefs"},
{id:"s129",subject:"Sociology II",topic:"Tribal Communities",q:"Inner Line Regulations year and purpose?",a:"1873 — restricted outsider entry"},
{id:"s130",subject:"Sociology II",topic:"Tribal Communities",q:"Which uprisings did colonial segregation seek to prevent recurrence of?",a:"Santhal, Munda, Kol uprisings"},
{id:"s131",subject:"Sociology II",topic:"Tribal Communities",q:"Elwin's evolved position beyond isolationism?",a:"'Philosophy of Neighbourliness' — middle path between isolation and forced integration; tribals should choose what to adopt from mainstream"},
{id:"s132",subject:"Sociology II",topic:"Tribal Communities",q:"Nehru's Panchsheel principle on tribes?",a:"Respect rights, don't impose, work through their institutions — 'develop along lines of their own genius'"},
{id:"s133",subject:"Sociology II",topic:"Tribal Communities",q:"Which tribes did Elwin work among?",a:"Baigas, Gonds, Maria tribes"},
{id:"s134",subject:"Sociology II",topic:"Tribal Communities",q:"Niyamgiri Gram Sabha (2013) significance?",a:"Dongria Kondh rejecting Vedanta mining — vindicates Elwin's emphasis on tribal voice; exemplifies ideal integration"},
{id:"s135",subject:"Sociology II",topic:"Tribal Communities",q:"Which village exemplifies Gram Sabha-led community forest management?",a:"Mendha-Lekha village (Maharashtra)"},
{id:"s136",subject:"Sociology II",topic:"Tribal Communities",q:"Key legal frameworks balancing integration and autonomy?",a:"Fifth Schedule (Scheduled Areas); Sixth Schedule (autonomous councils in NE); PESA (1996); FRA (2006); Inner Line Permit"},
{id:"s137",subject:"Sociology II",topic:"Tribal Communities",q:"Bina Agarwal on forest rights?",a:"Legal rights enhance economic status — Ex: Soliga tribe (Karnataka) marketing honey and lichen"},
{id:"s138",subject:"Sociology II",topic:"Tribal Communities",q:"Nandini Sundar's critique on FRA/PESA?",a:"Robust implementation needed; PESA and FRA poorly enforced"},
{id:"s139",subject:"Sociology II",topic:"Tribal Communities",q:"Tribal Sub Plan — year initiated and purpose?",a:"1974 — channels plan funds proportionate to tribal population for socio-economic development"},
{id:"s140",subject:"Sociology II",topic:"Tribal Communities",q:"PVTG — when created and defining features?",a:"1973, renamed 2006. Features: pre-agricultural technology, fragile economic base, low literacy, stagnant/declining population, physical isolation"},
{id:"s141",subject:"Sociology II",topic:"Tribal Communities",q:"How many PVTGs and where?",a:"75 PVTGs across 18 states and one UT"},
{id:"s142",subject:"Sociology II",topic:"Tribal Communities",q:"Examples of demographically vulnerable PVTGs?",a:"Great Andamanese fewer than 50; Sentinelese of North Sentinel Island; Chenchus (AP/Telangana) with deep forest-ecology knowledge"},
{id:"s143",subject:"Sociology II",topic:"Tribal Communities",q:"Colonial illustration of religious change among tribes?",a:"Welsh Presbyterian Mission in 19th-century Meghalaya — Khasis embraced Christianity but retained traditional rituals (syncretic practice); similar among Mizo, Naga"},
{id:"s144",subject:"Sociology II",topic:"Tribal Communities",q:"Post-independence illustration of tribal religious revival?",a:"Jharkhand Movement — revitalising Sarna religion; Jharkhand Assembly (2020) resolution for Sarna Census code; Birsa Munda's Ulgulan (1899-1900)"},
{id:"s145",subject:"Sociology II",topic:"Tribal Communities",q:"Contemporary tribal religious codification movements?",a:"Codification of Gondi religion; Sari Dhorom movement among Santhals. Tension: codification may standardise what was fluid"},
{id:"s146",subject:"Sociology II",topic:"Ethnicity",q:"Barth's contribution to ethnicity theory?",a:"Ethnic boundaries maintained through interaction, not isolation; differences emphasised to legitimise governance demands"},
{id:"s147",subject:"Sociology II",topic:"Ethnicity",q:"Hechter's Internal Colonialism thesis?",a:"Periphery's exploitation generates ethnically framed resistance — Ex: Jharkhand, Chhattisgarh tribal movements against industrial projects"},
{id:"s148",subject:"Sociology II",topic:"Ethnicity",q:"McCarthy & Zald's theory applied to ethnic conflict?",a:"Resource mobilisation theory — ethnic narrative rallies support for resource control"},
{id:"s149",subject:"Sociology II",topic:"Ethnicity",q:"Sumner's concept and its conflict mechanism?",a:"Ethnocentrism — belief in the inherent superiority of one's own ethnic group"},
{id:"s150",subject:"Sociology II",topic:"Ethnicity",q:"Stuart Hall's mechanism of conflict?",a:"'Othering' — representation creates us-vs-them divisions"},
{id:"s151",subject:"Sociology II",topic:"Ethnicity",q:"Michael Mann's work on ethnic violence?",a:"'The Dark Side of Democracy' — political instrumentalisation of ethnicity"},
{id:"s152",subject:"Sociology II",topic:"Ethnicity",q:"Putnam's concern about ethnic isolation?",a:"Ethnic isolation erodes social capital; cross-ethnic social capital building is the corrective"},
{id:"s153",subject:"Sociology II",topic:"Ethnicity",q:"Vertovec's concept on migration?",a:"'Super-diversity'"},
{id:"s154",subject:"Sociology II",topic:"Ethnicity",q:"Rajni Kothari on identity politics?",a:"Ethnicity-politics nexus threatens social harmony; electoral politics promotes identity-based mobilisation. Also theorised the 'Congress System' (1950s-70s)"},
{id:"s155",subject:"Sociology II",topic:"Ethnicity",q:"Ashutosh Varshney's focus?",a:"Communal violence — recurring conflicts from Partition onward"},
{id:"s156",subject:"Sociology II",topic:"Ethnicity",q:"Anthony D. Smith on ethno-nationalism?",a:"Draws on historical identities for political mobilisation; 'sons of the soil' movements"},
{id:"s157",subject:"Sociology II",topic:"Ethnicity",q:"Mamdani on decolonisation legacies?",a:"Colonial 'divide and rule' left lasting effects — Ex: Rwanda, Belgian exacerbation of Hutu-Tutsi differences"},
{id:"s158",subject:"Sociology II",topic:"Ethnicity",q:"Felix Padel and Virginius Xaxa's emphasis?",a:"Recognise the tribe-environment relationship in policy"},
{id:"s159",subject:"Sociology II",topic:"Ethnicity",q:"B.K. Roy Burman's argument on autonomy?",a:"Cultural factors drive autonomy demands; integration imposes mainstream values; tribal regions resource-rich but tribals impoverished"},
{id:"s160",subject:"Sociology II",topic:"Ethnicity",q:"Goffman and Stanley Freed on integration challenges?",a:"Goffman's stigma — tribal identity as disadvantage; Stanley Freed — cultural dilution creates an identity vacuum"},
{id:"s161",subject:"Sociology II",topic:"Ethnicity",q:"Gail Omvedt on ethnic movements?",a:"Economic inequalities spur Dalit/Adivasi movements"},
{id:"s162",subject:"Sociology II",topic:"Ethnicity",q:"Which forms has identity politics taken in India?",a:"Language-based (Paul Brass: DMK, Shiv Sena); Gender (Nivedita Menon: Women's Reservation Bill); Mass mobilisation (Atul Kohli: AAP); Eco-politics (Ramachandra Guha: Chipko); Tribal identity (Jharkhand/Chhattisgarh); Communist (K.N. Raj: Kerala, West Bengal)"}

];

<script type="module">
let initializeApp,getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,
    getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot;
async function loadFirebase(){
  const B="https://www.gstatic.com/firebasejs/10.12.2/";
  const [a,b,c] = await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
  initializeApp=a.initializeApp;
  ({getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=b);
  ({getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot}=c);
}

/* ---------------------------------------------------------- constants */
const D = window.APP_DATES;
const PHASES = [
  {id:"A", name:"Mains depth",        until:D.phaseBStart, iv:[3,10,30,75]},
  {id:"B", name:"Prelims sprint",     until:D.phaseCStart, iv:[2,7,21,45]},
  {id:"C", name:"Mains consolidation",until:"2099-01-01",  iv:[3,10,30,75]}
];
const STATES = [["reading","Reading"],["notes","Notes done"],["revised","Revised"],["hidden","Hidden (backlog)"]];
const PAPERS = Object.keys(window.SYLLABUS);
const DAY = 86400000;

/* ---------------------------------------------------------- date utils */
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const parseD = s => { if(!s) return null; const d=new Date(s+"T00:00:00"); return isNaN(d)?null:d.getTime(); };
const iso = ms => new Date(ms).toISOString().slice(0,10);
const fmt = ms => ms==null ? "—" :
  new Date(ms).getDate()+" "+new Date(ms).toLocaleString("en-GB",{month:"short"})+" "+String(new Date(ms).getFullYear()).slice(2);
const rel = ms => { const d=Math.round((ms-today0())/DAY);
  return d===0?"today":d===1?"tomorrow":d===-1?"1 day late":d<0?Math.abs(d)+" days late":"in "+d+" days"; };
const within = (s,n) => { const t=parseD(s); return t!=null && t<=today0() && t>today0()-n*DAY; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n=parseFloat(v); return isNaN(n)?0:n; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function phase(){ const t=today0(); for(const p of PHASES){ if(t < parseD(p.until)) return p; } return PHASES[2]; }
function weekStart(ms){ const d=new Date(ms); const k=(d.getDay()+6)%7; return iso(ms-k*DAY); }

/* ---------------------------------------------------------- state */
let items = {};              // id -> record
let view = "today";
let user = null, db = null, cloud = false;
let filters = {q:"",paper:"",state:""};
let quiz = null;

/* ---------------------------------------------------------- storage */
const LKEY = "upsc-cc-v1";
function localLoad(){ try{ items = JSON.parse(localStorage.getItem(LKEY)||"{}"); }catch(e){ items={}; } }
function localSave(){ try{ localStorage.setItem(LKEY, JSON.stringify(items)); }catch(e){} }

async function put(rec){
  if(!rec.id) rec.id = uid();
  items[rec.id] = rec; render();
  if(cloud && user){
    const {id,...body} = rec;
    try{ await setDoc(doc(db,"users",user.uid,"items",id), body); }
    catch(e){ note("Save failed — check your connection.", true); }
  } else localSave();
  return rec;
}
async function drop(id){
  delete items[id]; render();
  if(cloud && user){ try{ await deleteDoc(doc(db,"users",user.uid,"items",id)); }catch(e){} }
  else localSave();
}
const all = type => Object.values(items).filter(r=>r.type===type);
const one = id => items[id];

/* ---------------------------------------------------------- revision engine */
function cycles(t){
  const base = parseD(t.started); if(base==null) return [];
  const iv = phase().iv;
  return iv.map((off,i)=>{
    const due = base + off*DAY, done = !!(t.done&&t.done[i]);
    return {i,due,done,label:"R"+(i+1),
      status: done?"done": due<today0()?"late": due===today0()?"due":"soon"};
  });
}
const nextCycle = t => cycles(t).find(c=>!c.done) || null;
const activeTopics = () => all("topic").filter(t=>t.state && t.state!=="hidden" && t.started);
function dueList(){
  const out=[];
  activeTopics().forEach(t=>{ const c=nextCycle(t); if(c && c.status!=="soon") out.push({t,c}); });
  return out.sort((a,b)=>a.c.due-b.c.due);
}
function magCycles(m){
  const base = parseD(m.end); if(base==null || !m.end) return [];
  return [15,45].map((off,i)=>{
    const due=base+off*DAY, done=!!(m.done&&m.done[i]);
    return {i,due,done,label:"R"+(i+1),
      status: done?"done": due<today0()?"late": due===today0()?"due":"soon"};
  });
}
function magDue(){
  const out=[];
  all("mag").forEach(m=>{ const c=magCycles(m).find(x=>!x.done); if(c && c.status!=="soon") out.push({m,c}); });
  return out.sort((a,b)=>a.c.due-b.c.due);
}

/* ---------------------------------------------------------- syllabus helpers */
function syllabusKey(p,s,t){ return p+"||"+s+"||"+t; }
function topicFor(p,s,t){
  return all("topic").find(r=>r.paper===p&&r.subject===s&&r.topic===t) || null;
}
function coverage(paper){
  let total=0, done=0, hidden=0;
  const subs = window.SYLLABUS[paper];
  for(const s in subs) for(const t of subs[s]){
    const r = topicFor(paper,s,t);
    if(r && r.state==="hidden"){ hidden++; continue; }
    total++;
    if(r && (r.state==="notes"||r.state==="revised")) done++;
  }
  return {total,done,hidden,pct: total? Math.round(done/total*100):0};
}

function countdown(){
  const t=today0(), ye=parseD(D.yearEnd), pre=parseD(D.prelims);
  let n, l;
  if(t<=ye){ n=Math.round((ye-t)/DAY); l="days to 31 December"; }
  else { n=Math.round((pre-t)/DAY); l = n>=0 ? "days to Prelims" : "days since Prelims"; n=Math.abs(n); }
  document.getElementById("cdN").textContent=n;
  document.getElementById("cdL").textContent=l;
  const p=phase();
  document.getElementById("phase").textContent="Phase "+p.id+" · "+p.name;
}
function render(){

  const b=document.getElementById("bDue"); b.textContent=d; b.classList.toggle("hide",d===0);

}

/* ---------------------------------------------------------- QUESTION GAME */
function pickQuestions(){
  const logs = all("qlog");
  const seen = {};
  logs.forEach(l=>{ if(!seen[l.qid] || l.date>seen[l.qid].date) seen[l.qid]=l; });
  const t = today0();
  const missed = window.QUESTIONS.filter(q=> seen[q.id] && !seen[q.id].ok
      && parseD(seen[q.id].date) <= t-2*DAY);
  const fresh  = window.QUESTIONS.filter(q=> !seen[q.id]);
  const old    = window.QUESTIONS.filter(q=> seen[q.id] && seen[q.id].ok
      && parseD(seen[q.id].date) <= t-21*DAY);
  const seed = Math.floor(t/DAY);
  const shuffle = arr => arr.map((v,i)=>[((seed*9301+i*49297)%233280),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  return [...shuffle(missed), ...shuffle(fresh), ...shuffle(old)].slice(0,5);
}
function vQuiz(){
  const doneToday = all("qlog").filter(l=>l.date===iso(today0()));
  if(doneToday.length>=5 && !quiz){
    const right = doneToday.filter(l=>l.ok).length;
    return '<div class="empty"><strong>Today\'s five are done — '+right+' out of 5</strong>'
      + (right===5? 'Clean sweep. The ones you missed earlier will come back on their own.'
                  : 'The ones you missed come back in two days.')
      + '</div><div style="text-align:center;margin-top:12px"><button class="btn" data-act="quizmore">Do five more anyway</button></div>'
      + quizStats();
  }
  if(!quiz){ quiz = {list:pickQuestions(), i:0, shown:false, results:[]}; }
  if(!quiz.list.length) return '<div class="empty"><strong>Question bank is empty</strong>Add questions to data/questions.js.</div>';

  const q = quiz.list[quiz.i];
  if(!q) { const r=quiz.results.filter(Boolean).length; const n=quiz.list.length; quiz=null;
    return '<div class="empty"><strong>'+r+' out of '+n+'</strong>Come back tomorrow for five more.</div>'+quizStats(); }

  let h = '<div class="qprog">'+quiz.list.map((_,i)=>
      '<span class="qdot '+(i<quiz.i?(quiz.results[i]?"ok":"no"):(i===quiz.i?"now":""))+'"></span>').join("")+'</div>';
  h += '<div class="qcard">'
    + '<div class="qnum">Question '+(quiz.i+1)+' of '+quiz.list.length+' · '+esc(q.subject)+' · '+esc(q.topic)+'</div>'
    + '<div class="qtext">'+esc(q.q)+'</div>';
  if(quiz.shown){
    h += '<div class="qans">'+esc(q.a)+'</div>'
      + '<div class="inline"><button class="btn primary" data-act="qmark" data-ok="1">I knew it</button>'
      + '<button class="btn" data-act="qmark" data-ok="0">I did not</button></div>';
  } else {
    h += '<button class="btn primary" data-act="qshow">Show answer</button>';
  }
  h += '</div><p class="hint">Answers are your own note text. Nothing here is AI-generated.</p>';
  return h;
}
function quizStats(){
  const logs=all("qlog"); if(!logs.length) return "";
  const seen={}; logs.forEach(l=>{ if(!seen[l.qid]||l.date>seen[l.qid].date) seen[l.qid]=l; });
  const known=Object.values(seen).filter(l=>l.ok).length;
  return '<div class="stats" style="margin-top:18px">'
    + stat(Object.keys(seen).length+" / "+window.QUESTIONS.length,"Questions seen")
    + stat(known,"Currently known","good")
    + stat(Object.values(seen).filter(l=>!l.ok).length,"To come back",
        Object.values(seen).filter(l=>!l.ok).length?"alert":"")
    + '</div>';
}

function vProgress(){
  let h = '<section><h2>Coverage by paper</h2><div class="card">';
  h += '<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">'
    + PAPERS.map(p=>ring(coverage(p).pct,p)).join("") + '</div></div></section>';

  // active vs passive, last 8 weeks
  const weeks=[];
  for(let w=7;w>=0;w--){
    const startMs = today0()-(w*7+((new Date().getDay()+6)%7))*DAY;
    const days = all("day").filter(d=>{ const t=parseD(d.date); return t!=null && t>=startMs && t<startMs+7*DAY; });
    let a=0,p=0;
    days.forEach(d=>(d.slots||[]).forEach(s=>{ (s.mode==="active"?a+=num(s.hrs):p+=num(s.hrs)); }));
    weeks.push({label:fmt(startMs).slice(0,6),a,p});
  }
  h += '<section><h2>Active vs passive hours</h2><p class="hint">Reading is not the same currency as producing. This is the number to watch.</p>'
    + '<div class="card">'+stackChart(weeks)+'</div></section>';

  // revision debt
  const debt=[];
  for(let d=29;d>=0;d--){
    const t=today0()-d*DAY; let n=0;
    activeTopics().forEach(tp=>{
      const base=parseD(tp.started); if(base==null) return;
      phase().iv.forEach((off,i)=>{ if(!(tp.done&&tp.done[i]) && base+off*DAY < t) n++; });
    });
    debt.push(n);
  }
  h += '<section><h2>Revision debt, last 30 days</h2><p class="hint">Overdue revisions outstanding. Down and flat is the goal.</p>'
    + '<div class="card">'+lineChart(debt)+'</div></section>';

  // self-marks
  const marks = all("day").filter(d=>d.mark).sort((a,b)=>(parseD(a.date)||0)-(parseD(b.date)||0)).slice(-30);
  if(marks.length>2){
    h += '<section><h2>How your days felt</h2><p class="hint">Plot this against the active-hours chart above. Most people are surprised by which days score well.</p>'
      + '<div class="card">'+lineChart(marks.map(m=>+m.mark),5)+'</div></section>';
  }
  return h;
}
function ring(pct,label){
  const r=30,c=2*Math.PI*r;
  return '<div style="text-align:center;width:92px">'
    + '<svg viewBox="0 0 80 80" style="width:76px;height:76px">'
    + '<circle cx="40" cy="40" r="'+r+'" fill="none" stroke="var(--panel-2)" stroke-width="9"/>'
    + '<circle cx="40" cy="40" r="'+r+'" fill="none" stroke="var(--brass)" stroke-width="9" stroke-linecap="round"'
    + ' stroke-dasharray="'+(c*pct/100)+' '+c+'" transform="rotate(-90 40 40)"/>'
    + '<text x="40" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">'+pct+'</text></svg>'
    + '<div style="font-size:12px;color:var(--muted);margin-top:2px">'+esc(label)+'</div></div>';
}
function stackChart(weeks){
  const max=Math.max(1,...weeks.map(w=>w.a+w.p));
  const W=560,H=150,bw=W/weeks.length;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+(H+22)+'">';
  weeks.forEach((w,i)=>{
    const x=i*bw+bw*.2, wd=bw*.6;
    const ph=(w.p/max)*H, ah=(w.a/max)*H;
    s+='<rect x="'+x+'" y="'+(H-ph)+'" width="'+wd+'" height="'+ph+'" fill="var(--line)" rx="2"/>';
    s+='<rect x="'+x+'" y="'+(H-ph-ah)+'" width="'+wd+'" height="'+ah+'" fill="var(--brass)" rx="2"/>';
    s+='<text x="'+(x+wd/2)+'" y="'+(H+15)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+esc(w.label)+'</text>';
  });
  s+='</svg><div class="legend"><span><i style="background:var(--brass)"></i>Active</span>'
    +'<span><i style="background:var(--line)"></i>Passive</span></div>';
  return s;
}
function lineChart(vals,forceMax){
  const max=Math.max(1,forceMax||Math.max(...vals));
  const W=560,H=130;
  const pts=vals.map((v,i)=>[(i/(Math.max(1,vals.length-1)))*W, H-(v/max)*H]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return '<svg class="chart" viewBox="0 0 '+W+' '+(H+4)+'">'
    + '<path d="'+d+'" fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linejoin="round"/>'
    + '<circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="4" fill="var(--brass)"/>'
    + '</svg><p class="hint" style="margin:6px 0 0">Latest: '+vals[vals.length-1]+'</p>';
}

/* ---------------------------------------------------------- form helpers */
function fld(l,c){ return '<div class="f"><label>'+l+'</label>'+c+'</div>'; }
function sel(n,opts,def){ return '<select name="'+n+'">'+opts.map(o=>'<option'+(o===def?" selected":"")+'>'+esc(o)+'</option>').join("")+'</select>'; }
function restoreFilters(){
  const q=document.getElementById("fq"); if(!q) return;
  q.value=filters.q; document.getElementById("fp").value=filters.paper; document.getElementById("fs").value=filters.state;
}

/* ---------------------------------------------------------- events */
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]"); if(!b) return;
  view=b.dataset.v; if(view!=="quiz") quiz=null; render();
});

document.body.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act;

  if(act==="signin"){ try{ await signInWithPopup(getAuth(), new GoogleAuthProvider()); }catch(err){ note("Sign-in failed.",true);} return; }
  if(act==="signout"){ await signOut(getAuth()); return; }

  if(act==="cell"){
    const [p,s,t]=b.dataset.key.split("||");
    const cur=topicFor(p,s,t);
    const idx=STATES.findIndex(x=>x[0]===(cur&&cur.state));
    const next=STATES[(idx+1)%(STATES.length+1)];
    if(!next){ if(cur) await drop(cur.id); return; }
    const rec = cur ? {...cur} : {id:uid(),type:"topic",paper:p,subject:s,topic:t,done:[false,false,false,false]};
    rec.state=next[0];
    if(next[0]==="reading" && !rec.started) rec.started=iso(today0());
    if(next[0]==="revised") rec.done=[true,true,true,true];
    await put(rec); return;
  }
  if(act==="mark"||act==="toggle"){
    const t=one(b.dataset.id); if(!t) return;
    const i=+b.dataset.i, done=Array.isArray(t.done)?t.done.slice():[false,false,false,false];
    done[i]= act==="mark" ? true : !done[i];
    const rec={...t,done}; if(done.every(Boolean)) rec.state="revised";
    await put(rec); return;
  }
  if(act==="markmag"||act==="togglemag"){
    const m=one(b.dataset.id); if(!m) return;
    const i=+b.dataset.i, done=Array.isArray(m.done)?m.done.slice():[false,false];
    done[i]= act==="markmag" ? true : !done[i];
    await put({...m,done}); return;
  }
  if(act==="del"){ if(confirm("Delete this entry permanently?")) await drop(b.dataset.id); return; }
  if(act==="editday"){ const d=one(b.dataset.id); if(!d) return;
    view="daily"; render();
    document.getElementById("main").insertAdjacentHTML("afterbegin",
      '<div class="card" style="margin-bottom:12px"><h2>Editing '+fmt(parseD(d.date))+'</h2>'+dayForm(d)+'</div>');
    window.scrollTo({top:0}); return; }
  if(act==="edittopic"){
    const t=one(b.dataset.id); if(!t) return;
    const s=prompt("State — reading / notes / revised / hidden:", t.state);
    if(s && STATES.some(x=>x[0]===s)) { const st=prompt("Date started (YYYY-MM-DD):",t.started)||t.started;
      await put({...t,state:s,started:st}); }
    return; }
  if(act==="editmag"){
    const m=one(b.dataset.id); if(!m) return;
    const end=prompt("End date (YYYY-MM-DD) — leave blank if still reading:", m.end||"");
    await put({...m, end: end? end.trim():""}); return; }
  if(act==="qshow"){ quiz.shown=true; render(); return; }
  if(act==="qmark"){
    const ok=b.dataset.ok==="1", q=quiz.list[quiz.i];
    quiz.results[quiz.i]=ok; quiz.i++; quiz.shown=false;
    await put({id:uid(),type:"qlog",qid:q.id,ok,date:iso(today0())});
    return; }
  if(act==="quizmore"){ quiz={list:pickQuestions(),i:0,shown:false,results:[]}; render(); return; }
});

document.body.addEventListener("input",e=>{
  if(e.target.id==="fq"){ filters.q=e.target.value; softRender("fq"); }
});
document.body.addEventListener("change",e=>{
  if(e.target.id==="fp"){ filters.paper=e.target.value; render(); }
  if(e.target.id==="fs"){ filters.state=e.target.value; render(); }
});
function softRender(focusId){
  const pos=document.activeElement&&document.activeElement.selectionStart;
  render();
  const el=document.getElementById(focusId);
  if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
}

document.body.addEventListener("submit", async e=>{
  const f=e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault();
  const d=Object.fromEntries(new FormData(f).entries());
  const kind=f.dataset.form;

  if(kind==="day"){
    const labels=["Slot 1 — GS","Slot 2 — Optional","Slot 3 — CA / answers / revision"];
    const slots=[0,1,2].map(i=>({label:labels[i],text:(d["s"+i]||"").trim(),hrs:d["h"+i]||"",mode:d["m"+i]||"passive"}));
    const existing = d.id? one(d.id) : all("day").find(x=>x.date===d.date);
    await put({id: existing?existing.id:uid(), type:"day", date:d.date, slots, mark:+d.mark||0, note:(d.note||"").trim()});
    note("Day saved.");
  }
  if(kind==="week"){
    const existing = d.id? one(d.id) : all("week").find(w=>w.weekStart===d.weekStart);
    await put({id: existing?existing.id:uid(), type:"week", weekStart:d.weekStart, mark:+d.mark||0, note:(d.note||"").trim()});
    const s=one("settings")||{id:"settings",type:"settings"};
    await put({...s, answerTarget:+d.target||14});
  }
  if(kind==="answer"){
    await put({id:uid(),type:"answer",date:d.date,paper:d.paper,topic:(d.topic||"").trim(),
      mins:d.mins,score:d.score,flaw:(d.flaw||"").trim()});
  }
  if(kind==="mag"){
    if(!(d.name||"").trim()) return;
    await put({id:uid(),type:"mag",name:d.name.trim(),subject:(d.subject||"").trim(),
      month:(d.month||"").trim(),start:d.start,end:d.end||"",done:[false,false]});
  }
  f.reset(); render();
});

/* ---------------------------------------------------------- boot */
function subscribe(){
  onSnapshot(collection(db,"users",user.uid,"items"), snap=>{
    const next={}; snap.forEach(dd=>{ next[dd.id]=Object.assign({id:dd.id},dd.data()); });
    items=next; whoLine(); render();
  }, ()=>{ note("Lost connection to your data.",true); });
}
(async function boot(){
  try{
    if(!window.SYLLABUS||!window.QUESTIONS) throw new Error("Data did not load.");
    render();
    const cfg=window.FIREBASE_CONFIG;
    if(cfg && cfg.apiKey && cfg.projectId){
      try{
        await loadFirebase();
        cloud=true;
        const app=initializeApp(cfg); db=getFirestore(app);
        onAuthStateChanged(getAuth(app), u=>{
          user=u||null;
          if(user) subscribe(); else { items={}; whoLine(); render(); }
        });
      }catch(err){ cloud=false; localLoad(); render(); }
    } else { localLoad(); render(); }
    whoLine();
  }catch(err){
    document.getElementById("main").innerHTML =
      '<div class="empty"><strong>Something went wrong starting up</strong>'+String(err.message)+'</div>';
    document.getElementById("who").textContent="";
  }
})();
</script>
